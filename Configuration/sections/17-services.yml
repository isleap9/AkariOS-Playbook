  - !service: {name: 'sermouse', operation: change, startup: 4}
  - !service: {name: 'ErrDev', operation: change, startup: 4}
  - !service: {name: 'CompositeBus', operation: change, startup: 4}
  - !service: {name: 'SCardSvr', operation: change, startup: 4}            # Smart Card
  - !service: {name: 'ScDeviceEnum', operation: change, startup: 4}        # Smart Card Device Enum
  - !service: {name: 'GpuEnergyDrv', operation: change, startup: 4, option: 'disable-powersave'}
  - !service: {name: 'ose', operation: change, startup: 4}              # Office Source Engine
  - !service: {name: 'osppsvc', operation: change, startup: 4}          # Office Software Protection Platform
  - !service: {name: 'ClickToRunSvc', operation: change, startup: 4}    # Office Click-to-Run
  # Restore networking-critical services to automatic start after mass disable (FSOS safety-net)
  - !powerShell: {command: 'foreach ($kv in @{iphlpsvc=2;tcpipreg=2;Dnscache=2;NlaSvc=2;netprofm=2}.GetEnumerator()) { $k = ''HKLM:\SYSTEM\CurrentControlSet\Services\'' + $kv.Key; if (Test-Path $k) { try { Set-ItemProperty $k ''Start'' $kv.Value DWord -Force -EA 0 } catch {} } }', runas: currentUserElevated, wait: true}
  # Fix "Not connected" cosmetic bug — create key first (may not exist), then enable NCSI probing, restart services
  - !registryKey: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\NlaSvc\Parameters\Internet', operation: add}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\NlaSvc\Parameters\Internet', value: 'EnableActiveProbing', type: REG_DWORD, data: '1'}
  - !powerShell: {command: 'Restart-Service netprofm -Force -EA 0; Restart-Service NlaSvc -Force -EA 0', runas: currentUserElevated, wait: true}

  # ==========================================================================
