  - !status: {status: 'Changing Wallpaper & Lockscreen'}
  - !powerShell: {command: '$path=''C:\Windows\Web\AkariOS\img0.png''; Get-ChildItem ''Registry::HKU'' | ForEach-Object {$key=$_.Name; [microsoft.win32.registry]::SetValue($key+''\Control Panel\Desktop'',''WallPaper'',$path,[Microsoft.Win32.RegistryValueKind]::String)}; Add-Type -TypeDefinition ''using System.Runtime.InteropServices; public class Wallpaper{[DllImport(\"user32.dll\",CharSet=CharSet.Auto)]public static extern int SystemParametersInfo(int uAction,int uParam,string lpvParam,int fuWinIni);}''; [Wallpaper]::SystemParametersInfo(20,0,$path,3)', runas: currentUserElevated, wait: true}
  - !powerShell: {command: 'Add-Type -AssemblyName System.Runtime.WindowsRuntime; [Windows.Storage.StorageFile,Windows.Storage,ContentType=WindowsRuntime] | Out-Null; [Windows.System.UserProfile.LockScreen,Windows.System.UserProfile,ContentType=WindowsRuntime] | Out-Null; $a=[System.WindowsRuntimeSystemExtensions].GetMethods(); $f=($a|Where-Object{$_.Name -eq ''AsTask'' -and $_.GetParameters()[0].ParameterType.Name -eq ''IAsyncOperation`1''})[0].MakeGenericMethod([Windows.Storage.StorageFile]).Invoke($null,@([Windows.Storage.StorageFile]::GetFileFromPathAsync(''C:\Windows\Web\AkariOS\img0.png''))).GetAwaiter().GetResult(); ($a|Where-Object{$_.Name -eq ''AsTask'' -and $_.GetParameters()[0].ParameterType.Name -eq ''IAsyncAction''})[0].Invoke($null,@([Windows.System.UserProfile.LockScreen]::SetImageFileAsync($f))).GetAwaiter().GetResult()', runas: currentUserElevated, wait: true}
  # Profile picture from bundled profile.png
  - !powerShell: {command: 'Add-Type -AssemblyName System.Drawing; $img=[System.Drawing.Image]::FromFile((Join-Path $PWD ''profile.png'')); $u=(Get-CimInstance Win32_ComputerSystem).UserName; $sid=(New-Object System.Security.Principal.NTAccount($u)).Translate([System.Security.Principal.SecurityIdentifier]).Value; $dest=''C:\Users\Public\AccountPictures\''+$sid; if(!(Test-Path $dest)){New-Item -Path $dest -ItemType Directory -Force|Out-Null}; $reg=''HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AccountPicture\Users\''+$sid; if(!(Test-Path $reg)){New-Item -Path $reg -Force|Out-Null}; @(1080,448,240,192,96,64,48,40,32)|ForEach-Object{$b=New-Object System.Drawing.Bitmap($_,$_);$g=[System.Drawing.Graphics]::FromImage($b);$g.DrawImage($img,0,0,$_,$_);$f=$dest+''\Image''+$_+''.png'';$b.Save($f);$g.Dispose();$b.Dispose();Set-ItemProperty -Path $reg -Name (''Image''+$_) -Value $f -Type String}; $img.Dispose()', exeDir: true, runas: currentUserElevated, wait: true}
  - !taskKill: {name: 'explorer'}

