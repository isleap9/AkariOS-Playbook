  # --- Shell taskbar feeds: hide news/interests across all loaded hives (FSOS) ---
  - !powerShell: {command: 'Get-ChildItem ''Registry::HKU'' -EA 0 | Where-Object { ($_.PSChildName -match ''^S-1-5-21-'' -and $_.PSChildName -notmatch ''_Classes$'') -or $_.PSChildName -eq ''.DEFAULT'' } | ForEach-Object { $k = ''Registry::HKU\'' + $_.PSChildName + ''\Software\Microsoft\Windows\CurrentVersion\Feeds''; New-Item -Path $k -Force -EA 0 | Out-Null; Set-ItemProperty -Path $k -Name ''ShellFeedsTaskbarViewMode'' -Value 2 -Type DWord -Force -EA 0 }', runas: currentUserElevated, wait: true}
  # --- Voice activation: disable across all loaded user hives (FSOS) ---
  - !powerShell: {command: '$vaS = @(''Registry::HKEY_USERS\.DEFAULT''); Get-ChildItem ''Registry::HKEY_USERS'' -EA 0 | Where-Object { $_.PSChildName -match ''^S-1-5-21-'' -and $_.PSChildName -notmatch ''_Classes$'' } | ForEach-Object { $vaS += ''Registry::HKEY_USERS\'' + $_.PSChildName }; foreach ($vs in $vaS) { $vk = $vs + ''\Software\Microsoft\Speech_OneCore\Settings\VoiceActivation''; try { New-Item $vk -Force -EA 0 | Out-Null } catch {}; try { Set-ItemProperty $vk ''UserPreferenceForAllApps'' 0 DWord -Force -EA 0 } catch {} }', runas: currentUserElevated, wait: true}
  # --- Capability access: bulk-deny privacy-sensitive capabilities across all user hives (FSOS) ---
  - !powerShell: {command: '$caps = @(''location'',''microphone'',''webcam'',''contacts'',''appointments'',''chat'',''email'',''phoneCall'',''phoneCallHistory'',''userDataTasks'',''userAccountInformation'',''radios'',''userNotificationListener'',''cellularData'',''appDiagnostics'',''activity''); foreach ($scope in @(''HKLM:\SOFTWARE'',''Registry::HKEY_USERS\.DEFAULT\Software'')) { foreach ($cap in $caps) { $b = $scope + ''\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\'' + $cap; try { New-Item $b -Force -EA 0 | Out-Null } catch {}; try { Set-ItemProperty $b ''Value'' ''Deny'' String -Force -EA 0 } catch {} } }; Get-ChildItem ''Registry::HKEY_USERS'' -EA 0 | Where-Object { $_.PSChildName -match ''^S-1-5-21-'' -and $_.PSChildName -notmatch ''_Classes$'' } | ForEach-Object { $sid = $_.PSChildName; foreach ($cap in $caps) { $b = ''Registry::HKEY_USERS\'' + $sid + ''\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\'' + $cap; try { New-Item $b -Force -EA 0 | Out-Null } catch {}; try { Set-ItemProperty $b ''Value'' ''Deny'' String -Force -EA 0 } catch {} } }', runas: currentUserElevated, wait: true}
