  # Copilot policy off (Ultimate) - durable, survives appx regeneration
  - !registryValue: {path: 'HKCU\Software\Policies\Microsoft\Windows\WindowsCopilot', value: 'TurnOffWindowsCopilot', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot', value: 'TurnOffWindowsCopilot', type: REG_DWORD, data: '1'}
  # Teams (kill process first, then remove installed + provisioned)
  - !taskKill: {name: '*teams*', ignoreErrors: true}
  - !appx: {name: '*MicrosoftTeams*', type: family}
  - !appx: {name: '*MSTeams*', type: family, weight: 10}
  # Communications apps (leaves taskbar leftovers unless removed via PS)
  - !powerShell: {command: 'Get-AppxPackage *windowscommunicationsapps* | Remove-AppxPackage', runas: currentUserElevated, errorAction: Ignore}
  - !appx: {name: '*microsoft.windowscommunicationsapps*', type: family, weight: 10}
  # Web experience / widgets
  - !powerShell: {command: 'Get-AppxPackage MicrosoftWindows.Client.WebExperience | Remove-AppxPackage', runas: currentUserElevated, errorAction: Ignore}
  - !appx: {name: '*WebExperienceHost*', type: app, unregister: true}
  # Windows Backup
  - !appx: {name: '*WindowsBackup*', type: app, unregister: true, weight: 10}
  # Ensure provisioned copies of the big offenders don't return for new users
  - !powerShell: {command: 'Get-AppxPackage Microsoft.YourPhone* | Remove-AppxPackage; Get-AppxProvisionedPackage -Online | Where-Object { $_.DisplayName -eq ''Microsoft.YourPhone'' } | Remove-AppxProvisionedPackage -Online', runas: currentUserElevated, wait: true, errorAction: Ignore}
  - !powerShell: {command: 'Get-AppxPackage MicrosoftTeams* | Remove-AppxPackage; Get-AppxProvisionedPackage -Online | Where-Object { $_.DisplayName -eq ''MicrosoftTeams'' } | Remove-AppxProvisionedPackage -Online', runas: currentUserElevated, wait: true, errorAction: Ignore}
