  # SECTION 16 - APPX DEBLOAT  (explicit allowlist style - ported from AkariV5)
  #
  #   KEEP (deliberately NOT removed - load-bearing or wanted):
  #     * Microsoft.WindowsTerminal      <- keeps CTRL+C/V + modern console
  #     * Microsoft.WindowsStore         <- app installs
  #     * Microsoft.DesktopAppInstaller  <- winget
  #     * Microsoft.WindowsNotepad       <- default editor
  #     * Microsoft.Paint                <- keep for everyday users
  #     * Microsoft.SecHealthUI          <- Defender UI (breaks if removed)
  #     * StartMenuExperienceHost / ShellExperienceHost / immersivecontrolpanel
  #     * *CBS*, video/image extensions  <- explorer + media stability
  #     * Xbox GamingApp + IdentityProvider (kept for Game Pass gamers)
  #   Only the explicitly listed packages below are removed.
  # ==========================================================================
