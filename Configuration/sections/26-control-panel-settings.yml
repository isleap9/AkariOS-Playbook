  # SECTION 26 - CONTROL PANEL SETTINGS
  #   All tweaks from ControlPanelSettings.reg are now inlined as
  #   !registryValue directives. The .reg file remains in Executables\ but
  #   is no longer imported (dead reference, kept for reference only).
  #   Extra runtime steps follow the registry block:
  #     • CapabilityConsentStorage.db wipe (forces privacy Deny grants)
  #     • ScheduledDefrag task disable
  #     • powercfg lock-on-idle off
  #     • Dynamic CloudStore GUID patching for priority-notifications
  #   Skipped from .reg (handled elsewhere or intentional omission):
  #     • Camera/Mic Allow  → FSOS bulk-deny PS block (Section 23) sets Deny
  #     • AutoGameModeEnabled 1 → set at Section 25 line (Game Mode ON)
  #     • DPI forcing (LogPixels/Win8DpiScaling) → user-hardware decision
  #     • Sound scheme / AppEvents → user audio preference
  #     • CloudStore binary blobs → dynamic PS block handles at runtime
  #     • FeatureManagement Overrides → deferred
  #     • Snap Assist / Wallpaper / Lockscreen → AkariOS handles separately
  #     • Capability ConsentStore Deny (all) → Section 23 bulk-deny PS block
  # ==========================================================================
