  # SECTION 15 - MICROSOFT EDGE  (vain model: gated on !browser-edge)
  #   Edge is a choice on the browser picker. If the user does NOT pick Edge
  #   (browser-edge), Edge is removed. Full teardown ported from Vain.
  # ==========================================================================
  - !status: {status: 'Removing Microsoft Edge', option: '!browser-edge'}
  - !service: {name: 'edgeupdate', operation: delete, option: '!browser-edge'}
  - !service: {name: 'edgeupdatem', operation: delete, option: '!browser-edge'}
  - !service: {name: 'MicrosoftEdgeElevationService', operation: delete, option: '!browser-edge'}
  - !file: {path: '%ProgramFiles(x86)%\Microsoft\EdgeUpdate', option: '!browser-edge'}
  - !file: {path: '%ProgramFiles(x86)%\Microsoft\EdgeCore', option: '!browser-edge'}
  - !file: {path: '%ProgramFiles(x86)%\Microsoft\Edge', option: '!browser-edge'}
  - !file: {path: '%ProgramFiles(x86)%\Microsoft\EdgeWebView', option: '!browser-edge'}
  - !file: {path: '%LocalAppdata%\Microsoft\Edge', option: '!browser-edge'}
  - !file: {path: '%ProgramData%\Microsoft\EdgeUpdate', option: '!browser-edge'}
  - !file: {path: '%SystemRoot%\system32\Tasks\MicrosoftEdge*', option: '!browser-edge'}
  - !file: {path: '%ProgramData%\Microsoft\Windows\Start Menu\Programs\Microsoft Edge.lnk', option: '!browser-edge'}
  - !file: {path: '%SystemDrive%\Users\Public\Desktop\Microsoft Edge.lnk', option: '!browser-edge'}
  - !file: {path: '%Appdata%\Microsoft\Internet Explorer\Quick Launch\Microsoft Edge.lnk', option: '!browser-edge'}
  - !file: {path: '%Appdata%\Microsoft\Internet Explorer\Quick Launch\User Pinned\TaskBar\Microsoft Edge.lnk', option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\EventLog\Application\Edge', option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\EventLog\Application\edgeupdate', option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\EventLog\Application\edgeupdatem', option: '!browser-edge'}
  - !registryKey: {path: 'HKCR\microsoft-edge', option: '!browser-edge'}
  - !registryKey: {path: 'HKCR\MSEdgeHTM', option: '!browser-edge'}
  - !registryKey: {path: 'HKCR\MSEdgeMHT', option: '!browser-edge'}
  - !registryKey: {path: 'HKCR\MSEdgePDF', option: '!browser-edge'}
  - !registryKey: {path: 'HKCU\Software\Microsoft\Active Setup\Installed Components\{9459C573-B17A-45AE-9F64-1857B5D58CEE}', option: '!browser-edge'}
  - !registryKey: {path: 'HKCU\Software\Microsoft\Edge', option: '!browser-edge'}
