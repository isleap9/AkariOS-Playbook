  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Edge', option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\EdgeUpdate', option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\msedge.exe', option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Microsoft Edge', option: '!browser-edge'}
  - !registryValue: {path: 'HKCR\.html\OpenWithProgIds', value: 'MSEdgeHTM', operation: 'delete', option: '!browser-edge'}
  - !registryValue: {path: 'HKCR\.htm\OpenWithProgIds', value: 'MSEdgeHTM', operation: 'delete', option: '!browser-edge'}
  - !registryValue: {path: 'HKCR\.pdf\OpenWithProgIds', value: 'MSEdgePDF', operation: 'delete', option: '!browser-edge'}
  - !registryValue: {path: 'HKCU\Software\RegisteredApplications', value: 'Microsoft Edge', operation: 'delete', option: '!browser-edge'}
  - !registryValue: {path: 'HKLM\SOFTWARE\RegisteredApplications', value: 'Microsoft Edge', operation: 'delete', option: '!browser-edge'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\EdgeUpdate', value: 'IsEdgeStableUninstalled', type: REG_DWORD, data: '1', option: '!browser-edge'}
  # WOW6432Node mirror
  - !registryKey: {path: 'HKLM\SOFTWARE\WOW6432Node\Clients\StartMenuInternet\Microsoft Edge', option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SOFTWARE\WOW6432Node\Microsoft\Edge', option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate', option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\App Paths\msedge.exe', option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Microsoft Edge', option: '!browser-edge'}
  # appx + update tasks
  - !appx: {name: '*Edge.GameAssist*', option: '!browser-edge'}
  - !appx: {name: '*MicrosoftEdgeDevToolsClient*', option: '!browser-edge'}
  - !appx: {name: '*MicrosoftEdge.Stable*', option: '!browser-edge'}
  - !powerShell: {command: "Get-ScheduledTask | Where-Object { $_.TaskName -like '*MicrosoftEdgeUpdate*' } | ForEach-Object { Unregister-ScheduledTask -TaskName $_.TaskName -Confirm:$false }", runas: currentUserElevated, wait: true, option: '!browser-edge'}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\EdgeUpdate', operation: 'delete', option: '!browser-edge'}
  - !powerShell: {command: "Get-ItemProperty 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Run' | % { $_.PSObject.Properties | ? { $_.Name -like 'MicrosoftEdge*' } | % { Remove-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Run' -Name $_.Name } }", runas: currentUserElevated, wait: true, option: '!browser-edge'}

