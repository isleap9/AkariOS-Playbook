  - !powerShell: {command: 'Get-ChildItem ''Registry::HKU'' -EA 0 | Where-Object { ($_.PSChildName -match ''^S-1-5-21-'' -and $_.PSChildName -notmatch ''_Classes$'') -or $_.PSChildName -eq ''.DEFAULT'' } | ForEach-Object { $k = ''Registry::HKU\'' + $_.PSChildName + ''\Software\Microsoft\Windows\CurrentVersion\Feeds''; New-Item -Path $k -Force -EA 0 | Out-Null; Set-ItemProperty -Path $k -Name ''ShellFeedsTaskbarViewMode'' -Value 2 -Type DWord -Force -EA 0 }', runas: currentUserElevated, wait: true}
