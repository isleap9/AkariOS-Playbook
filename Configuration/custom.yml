  # Restore networking-critical services to automatic start after mass disable (FSOS safety-net)
  - !powerShell: {command: 'foreach ($kv in @{iphlpsvc=2;tcpipreg=2;Dnscache=2;NlaSvc=2;netprofm=2}.GetEnumerator()) { $k = ''HKLM:\SYSTEM\CurrentControlSet\Services\'' + $kv.Key; if (Test-Path $k) { try { Set-ItemProperty $k ''Start'' $kv.Value DWord -Force -EA 0 } catch {} } }', runas: currentUserElevated, wait: true}
