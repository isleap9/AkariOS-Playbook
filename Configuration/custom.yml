---
# ============================================================================
#  AkariOS V6 - custom.yml
#  Monolithic AME playbook (structure based on Vain, logic ported from AkariV5)
#
#  Design decisions (see project spec):
#   1. Defender      : AkariV5 method - DISABLE (restorable via EnableDefender.ps1)
#   2. Performance   : Vain tweaks + NIC only (NO Vain Governor app/rules/toolbox)
#                      Power plan + timer resolution from WinSux
#   3. GPU           : post-install scripts only (DDU + nvidiaProfileInspector)
#   4. Safety net    : System Restore ON + WinRE ON  (no 'vssadmin delete shadows',
#                      no 'recoveryenabled no'; create a restore point at the end)
#   5. Apps          : Vain UI layer + browsers
#   6. Start/UI      : Vain start menu + UI, NO OpenShell
#   7. Updates       : PAUSE only (WinSux 365-day method), not disabled
#   8. Engine        : UseKernelDriver=false, TrustedInstaller level
#
#  Feature toggles (must match playbook.conf <Name> values):
#   disable-defender, disable-uac, disable-process-mitigations,
#   disable-spectre-meltdown, enable-dark-mode,
#   legacy-context-menu, remove-uwp-photos, disable-print, disable-bluetooth,
#   disable-wu, disable-powersave, remove-onedrive,
#   disable-hyperv, 7zip
#   Browser picker: browser-mercury/thorium/brave/firefoxdev/firefox/chrome/edge
#   Edge is removed via !browser-edge (i.e. unless the user picks Edge)
#   NOTE: 'akariserv' dropped entirely - remove it from playbook.conf too
#
#  Build progress:  [x] ALL 40 sections drafted (init -> end)
#  Pending: Executables\ pass. playbook.conf DONE (2-page browser picker with
#           Edge; Edge removed via !browser-edge; VPN + akariserv dropped).
# ============================================================================

actions:

  # ==========================================================================
  # SECTION 01 - INITIALIZE
  # ==========================================================================
  - !status: {status: 'Initializing'}
  # copy bundled Files\ tree onto the system drive (wallpaper, scripts, etc.)
  - !cmd: {exeDir: true, command: 'Robocopy Files %SystemDrive%\ /copy:DA /e /nfl /ndl /njh /nc /ns /np >nul'}
  # disable Smart App Control (blocks unsigned tweak tooling otherwise)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy', value: 'VerifiedAndReputablePolicyState', type: REG_DWORD, data: '0'}

  # ==========================================================================
  # SECTION 02 - THEME  (toggle: enable-dark-mode)  Ultimate true-black theme:
  #   dark mode + transparency off + near-black accent (ff191919), black start.
  # ==========================================================================
  - !status: {status: 'Applying Black Theme', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', type: REG_DWORD, data: '0', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '0', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'ColorPrevalence', type: REG_DWORD, data: '1', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'EnableTransparency', type: REG_DWORD, data: '0', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '0', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Accent', value: 'AccentPalette', type: REG_BINARY, data: '646464006b6b6b00000000000000000000000000000000000000000000000000', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Accent', value: 'StartColorMenu', type: REG_DWORD, data: '0', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Accent', value: 'AccentColorMenu', type: REG_DWORD, data: '0', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\DWM', value: 'EnableWindowColorization', type: REG_DWORD, data: '1', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\DWM', value: 'AccentColor', type: REG_DWORD, data: '4279834905', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\DWM', value: 'ColorizationColor', type: REG_DWORD, data: '3289979161', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\DWM', value: 'ColorizationAfterglow', type: REG_DWORD, data: '3289979161', option: 'enable-dark-mode'}
  - !registryValue: {path: 'HKCU\Control Panel\Colors', value: 'Background', type: REG_SZ, data: '0 0 0', option: 'enable-dark-mode'}

  # ==========================================================================
  # SECTION 03 - POWERSHELL CONFIG
  # ==========================================================================
  - !status: {status: 'Configuring PowerShell'}
  - !cmd: {command: 'setx POWERSHELL_TELEMETRY_OPTOUT 1 >nul'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell', value: 'ExecutionPolicy', type: REG_SZ, data: 'Unrestricted'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging', value: 'EnableModuleLogging', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging', value: 'EnableScriptBlockLogging', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging', value: 'EnableScriptBlockInvocationLogging', type: REG_DWORD, data: '0'}
  # run .ps1 by double-click + run as admin (vain)
  - !cmd: {command: 'ftype Microsoft.PowerShellScript.1="%systemroot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -EP Unrestricted -File "%1" %* >nul'}
  - !registryValue: {path: 'HKCR\Microsoft.PowerShellScript.1\Shell', value: '', type: REG_SZ, data: 'Open'}
  - !registryValue: {path: 'HKCR\Microsoft.PowerShellScript.1\Shell\Open\Command', value: '', type: REG_EXPAND_SZ, data: '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" "%1"'}
  - !registryValue: {path: 'HKCR\Microsoft.PowerShellScript.1\Shell\RunAs', value: 'HasLUAShield', type: REG_SZ, data: ''}
  - !registryValue: {path: 'HKCR\Microsoft.PowerShellScript.1\Shell\RunAs\Command', value: '', type: REG_EXPAND_SZ, data: '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" "%1"'}
  # .psm1 association (vain)
  - !registryValue: {path: 'HKCR\.psm1', value: '', type: REG_SZ, data: 'Microsoft.PowerShellModule.1'}
  - !registryValue: {path: 'HKCR\Microsoft.PowerShellModule.1\Shell', value: '', type: REG_SZ, data: 'Open'}
  - !registryKey: {path: 'HKCR\.psm1\OpenWithProgids'}
  - !registryKey: {path: 'HKCR\.ps1\OpenWithProgids'}

  # ==========================================================================
  # SECTION 04 - NGEN  (precompile .NET assemblies)
  # ==========================================================================
  - !status: {status: 'Installing NGEN'}
  - !powerShell: {command: '$env:PATH = [Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory() + '';'' + $env:PATH; foreach($a in [AppDomain]::CurrentDomain.GetAssemblies()){ if($a.Location){ ngen install $a.Location /nologo 2>&1 | Out-Null } }'}

  # ==========================================================================
  # SECTION 05 - NOTIFICATIONS
  # ==========================================================================
  - !status: {status: 'Disabling Notifications'}
  - !service: {name: 'WpnService', operation: change, startup: 4}
  - !service: {name: 'WpnService', operation: stop}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\PushNotifications', value: 'ToastEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications', value: 'NoCloudApplicationNotification', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\userNotificationListener', value: 'Value', type: REG_SZ, data: 'Deny'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings', value: 'NOC_GLOBAL_SETTING_ALLOW_NOTIFICATION_SOUND', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings', value: 'NOC_GLOBAL_SETTING_ALLOW_TOASTS_ABOVE_LOCK', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings', value: 'NOC_GLOBAL_SETTING_ALLOW_CRITICAL_TOASTS_ABOVE_LOCK', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'ShowSyncProviderNotifications', type: REG_DWORD, data: '0'}
  # Additional notification suppression (FSOS)
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings', value: 'NOC_GLOBAL_SETTING_TOASTS_ENABLED', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Notifications\Settings', value: 'NOC_GLOBAL_SETTING_BADGE_ENABLED', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications', value: 'NoTileApplicationNotification', type: REG_DWORD, data: '1'}

  # ==========================================================================
  # SECTION 06 - WINDOWS DEFENDER  (toggle: disable-defender)
  #   AkariV5 method: DISABLE (not delete) so the user can restore later via
  #   EnableDefender.ps1. Only DisableDefender.ps1 is needed (svchost.ps1 /
  #   Bitlocker.ps1 dropped - unrelated, and Bitlocker.ps1 had interactive pauses).
  # ==========================================================================
  - !status: {status: 'Disabling Windows Defender', option: 'disable-defender'}
  - !powerShell: {command: '.\DisableDefender.ps1', exeDir: true, runas: currentUserElevated, option: 'disable-defender'}
  # SmartScreen off (safe regardless of Defender toggle)
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer', value: 'SmartScreenEnabled', type: REG_SZ, data: 'Off'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', value: 'EnableSmartScreen', type: REG_DWORD, data: '0'}
  # LSA protection off (WinSux)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', value: 'RunAsPPL', type: REG_DWORD, data: '0'}
  # Vulnerable driver blocklist off (WinSux)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\CI\Config', value: 'VulnerableDriverBlocklistEnable', type: REG_DWORD, data: '0'}

  # ==========================================================================
  # SECTION 07 - USER ACCOUNT CONTROL  (toggle: disable-uac)
  # ==========================================================================
  - !status: {status: 'Disabling UAC', option: 'disable-uac'}
  - !service: {name: 'luafv', operation: change, startup: 4, option: 'disable-uac'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'EnableLUA', type: REG_DWORD, data: '0', option: 'disable-uac'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'PromptOnSecureDesktop', type: REG_DWORD, data: '0', option: 'disable-uac'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ConsentPromptBehaviorAdmin', type: REG_DWORD, data: '0', option: 'disable-uac'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ValidateAdminCodeSignatures', type: REG_DWORD, data: '0', option: 'disable-uac'}
  # allow password sign-in (WinSux)
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\PasswordLess\Device', value: 'DevicePasswordLessBuildVersion', type: REG_DWORD, data: '0'}

  # ==========================================================================
  # SECTION 08 - SOFTWARE / RUNTIMES  (VC++ redists + DirectX)
  # ==========================================================================
  - !status: {status: 'Installing VC Redist 2005'}
  - !download: {url: 'https://download.microsoft.com/download/8/B/4/8B42259F-5D70-43F4-AC2E-4B208FD8D66A/vcredist_x86.EXE', destination: '%temp%\2005_86.exe', overwrite: true}
  - !download: {url: 'https://download.microsoft.com/download/8/B/4/8B42259F-5D70-43F4-AC2E-4B208FD8D66A/vcredist_x64.EXE', destination: '%temp%\2005_64.exe', overwrite: true}
  - !cmd: {command: '"%temp%\2005_86.exe" /Q /C /T:%temp%\2005_86', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\2005_64.exe" /Q /C /T:%temp%\2005_64', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\2005_86\vcredist.msi" /quiet /norestart', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\2005_64\vcredist.msi" /quiet /norestart', runas: currentUserElevated, wait: true}
  - !file: {path: '%temp%\2005_86'}
  - !file: {path: '%temp%\2005_64'}

  - !status: {status: 'Installing VC Redist 2008'}
  - !download: {url: 'https://download.microsoft.com/download/5/D/8/5D8C65CB-C849-4025-8E95-C3966CAFD8AE/vcredist_x86.exe', destination: '%temp%\2008_86.exe', overwrite: true}
  - !download: {url: 'https://download.microsoft.com/download/5/D/8/5D8C65CB-C849-4025-8E95-C3966CAFD8AE/vcredist_x64.exe', destination: '%temp%\2008_64.exe', overwrite: true}
  - !cmd: {command: '"%temp%\2008_86.exe" /q', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\2008_64.exe" /q', runas: currentUserElevated, wait: true}

  - !status: {status: 'Installing VC Redist 2010'}
  - !download: {url: 'https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x86.exe', destination: '%temp%\2010_86.exe', overwrite: true}
  - !download: {url: 'https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe', destination: '%temp%\2010_64.exe', overwrite: true}
  - !cmd: {command: '"%temp%\2010_86.exe" /q', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\2010_64.exe" /q', runas: currentUserElevated, wait: true}

  - !status: {status: 'Installing VC Redist 2012'}
  - !download: {url: 'https://download.microsoft.com/download/1/6/B/16B06F60-3B20-4FF2-B699-5E9B7962F9AE/VSU_4/vcredist_x86.exe', destination: '%temp%\2012_86.exe', overwrite: true}
  - !download: {url: 'https://download.microsoft.com/download/1/6/B/16B06F60-3B20-4FF2-B699-5E9B7962F9AE/VSU_4/vcredist_x64.exe', destination: '%temp%\2012_64.exe', overwrite: true}
  - !cmd: {command: '"%temp%\2012_86.exe" /install /quiet /norestart', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\2012_64.exe" /install /quiet /norestart', runas: currentUserElevated, wait: true}

  - !status: {status: 'Installing VC Redist 2013'}
  - !download: {url: 'https://aka.ms/highdpimfc2013x86enu', destination: '%temp%\2013_86.exe', overwrite: true}
  - !download: {url: 'https://aka.ms/highdpimfc2013x64enu', destination: '%temp%\2013_64.exe', overwrite: true}
  - !cmd: {command: '"%temp%\2013_86.exe" /install /quiet /norestart', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\2013_64.exe" /install /quiet /norestart', runas: currentUserElevated, wait: true}

  - !status: {status: 'Installing VC Redist 2015-2022'}
  - !download: {url: 'https://aka.ms/vs/17/release/vc_redist.x86.exe', destination: '%temp%\2015_2022_86.exe', overwrite: true}
  - !download: {url: 'https://aka.ms/vs/17/release/vc_redist.x64.exe', destination: '%temp%\2015_2022_64.exe', overwrite: true}
  - !cmd: {command: '"%temp%\2015_2022_86.exe" /install /quiet /norestart', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\2015_2022_64.exe" /install /quiet /norestart', runas: currentUserElevated, wait: true}

  - !status: {status: 'Installing DirectX'}
  - !download: {url: 'https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe', destination: '%temp%\DirectX.exe', overwrite: true}
  - !cmd: {command: '"%temp%\DirectX.exe" /Q /C /T:%temp%\DirectX', runas: currentUserElevated, wait: true}
  - !cmd: {command: '"%temp%\DirectX\DXSETUP.exe" /silent', runas: currentUserElevated, wait: true}
  - !file: {path: '%temp%\DirectX'}

  # ==========================================================================
  # SECTION 09 - 7-ZIP  (toggle: 7zip)
  #   Install latest x64 from GitHub + core config/associations.
  #   (Full per-extension association list from Vain can be expanded later.)
  # ==========================================================================
  - !status: {status: 'Installing 7-Zip', option: '7zip'}
  - !download: {git: 'https://github.com/ip7z/7zip', regex: '^7z.*-x64\.exe$', destination: '%temp%\7Zip.exe', overwrite: true, option: '7zip'}
  - !cmd: {command: '"%temp%\7Zip.exe" /S', runas: currentUserElevated, wait: true, option: '7zip'}
  - !registryValue: {path: 'HKCU\Software\7-Zip\Options', value: 'ContextMenu', type: REG_DWORD, data: '4903', option: '7zip'}
  - !registryValue: {path: 'HKCU\Software\Classes\.7z', value: '', type: REG_SZ, data: '7-Zip.7z', option: '7zip'}
  - !registryValue: {path: 'HKCU\Software\Classes\.zip', value: '', type: REG_SZ, data: '7-Zip.zip', option: '7zip'}
  - !registryValue: {path: 'HKCU\Software\Classes\.rar', value: '', type: REG_SZ, data: '7-Zip.rar', option: '7zip'}
  - !registryValue: {path: 'HKCU\Software\Classes\.tar', value: '', type: REG_SZ, data: '7-Zip.tar', option: '7zip'}
  - !registryValue: {path: 'HKCU\Software\Classes\.gz', value: '', type: REG_SZ, data: '7-Zip.gz', option: '7zip'}
  - !registryValue: {path: 'HKCU\Software\Classes\.iso', value: '', type: REG_SZ, data: '7-Zip.iso', option: '7zip'}
  - !registryValue: {path: 'HKCU\Software\Classes\7-Zip.7z\shell\open\command', value: '', type: REG_SZ, data: '"C:\Program Files\7-Zip\7zFM.exe" "%1"', option: '7zip'}
  - !registryValue: {path: 'HKCU\Software\Classes\7-Zip.zip\shell\open\command', value: '', type: REG_SZ, data: '"C:\Program Files\7-Zip\7zFM.exe" "%1"', option: '7zip'}

  # ==========================================================================
  # SECTION 10 - BROWSERS  (Vain set: Mercury, Thorium, Brave, LibreWolf,
  #   Firefox, Chrome + Edge). Picker is the 2-page RadioImagePage in
  #   playbook.conf. Edge (browser-edge) installs nothing - it just marks Edge
  #   to be KEPT; Section 15 removes Edge via !browser-edge otherwise.
  #   Taskbar-pin binaries omitted (fragile per-user blobs) - installs only.
  # ==========================================================================
  - !status: {status: 'Installing Mercury', option: 'browser-mercury'}
  - !download: {git: 'https://github.com/Alex313031/Mercury', regex: '^mercury.*win64.*AVX2.*.exe$', destination: '%temp%\Mercury.exe', overwrite: true, option: 'browser-mercury'}
  - !cmd: {command: '"%temp%\Mercury.exe" /S', runas: currentUserElevated, option: 'browser-mercury'}

  - !status: {status: 'Installing Thorium', option: 'browser-thorium'}
  - !download: {git: 'https://github.com/Alex313031/Thorium-Win', regex: '^thorium_AVX2_mini_installer\.exe$', destination: '%temp%\Thorium.exe', overwrite: true, option: 'browser-thorium'}
  - !cmd: {command: '"%temp%\Thorium.exe" --silent --system-level --do-not-launch-chrome', runas: currentUserElevated, option: 'browser-thorium'}

  - !status: {status: 'Installing Brave', option: 'browser-brave'}
  - !download: {url: 'https://laptop-updates.brave.com/latest/winx64', destination: '%temp%\Brave.exe', overwrite: true, option: 'browser-brave'}
  - !cmd: {command: '"%temp%\Brave.exe" /silent /install', runas: currentUserElevated, option: 'browser-brave'}

  - !status: {status: 'Installing LibreWolf', option: 'browser-librewolf'}
  - !run: {exe: 'winget', args: 'install -e --id LibreWolf.LibreWolf --silent --accept-package-agreements --accept-source-agreements', runas: currentUserElevated, option: 'browser-librewolf'}

  - !status: {status: 'Installing Firefox', option: 'browser-firefox'}
  - !download: {url: 'https://download.mozilla.org/?product=firefox-latest&os=win64&lang=en-US', destination: '%temp%\Firefox.exe', overwrite: true, option: 'browser-firefox'}
  - !cmd: {command: '"%temp%\Firefox.exe" /S', runas: currentUserElevated, option: 'browser-firefox'}

  - !status: {status: 'Installing Chrome', option: 'browser-chrome'}
  - !download: {url: 'https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi', destination: '%temp%\Chrome.msi', overwrite: true, option: 'browser-chrome'}
  - !cmd: {command: '"%temp%\Chrome.msi" /quiet /norestart', runas: currentUserElevated, option: 'browser-chrome'}

  # ==========================================================================
  # SECTION 11 - START MENU / SEARCH  (Vain tweaks, NO OpenShell)
  # ==========================================================================
  - !status: {status: 'Configuring Start Menu'}
  - !service: {name: 'wsearch', operation: change, startup: 4}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Search', value: 'BingSearchEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'IsDeviceSearchHistoryEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'ConnectedSearchUseWeb', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'DisableWebSearch', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'EnableDynamicContentInWSB', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Policies\Microsoft\Windows\Explorer', value: 'DisableSearchBoxSuggestions', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Search', value: 'SearchboxTaskbarMode', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'IsDynamicSearchBoxEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer', value: 'NoStartMenuMFUprogramsList', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer', value: 'HideRecentlyAddedApps', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer', value: 'HideRecommendedPersonalizedSites', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'Start_IrisRecommendations', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'Start_AccountNotifications', type: REG_DWORD, data: '0'}
  # Cloud search / safe-search toggles (FSOS phase3)
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'SafeSearchMode', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'IsAADCloudSearchEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'IsMSACloudSearchEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'IsMSFTCloudSearchEnabled', type: REG_DWORD, data: '0'}

  # ==========================================================================
  # SECTION 12 - LEGACY NOTEPAD  +  LEGACY PHOTO VIEWER (toggle: remove-uwp-photos)
