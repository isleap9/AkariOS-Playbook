  # ==========================================================================
  - !status: {status: 'Configuring NIC'}
  - !powerShell: {command: 'Get-ChildItem ''HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e972-e325-11ce-bfc1-08002be10318}'' -EA 0 | Where-Object {$_.PSChildName -match ''^\d{4}$''} | ForEach-Object { $p=$_.PSPath; Set-ItemProperty -Path $p -Name ''PnPCapabilities'' -Value 24 -Type DWord -Force -EA 0; foreach($n in @(''*EEE'',''EEELinkAdvertisement'',''AdvancedEEE'',''GigaLite'',''ULPMode'',''SipsEnabled'',''EnableGreenEthernet'',''PowerSavingMode'',''*WakeOnMagicPacket'',''*WakeOnPattern'',''*ModernStandbyWoLMagicPacket'',''WakeOnLink'',''S5WakeOnLan'',''*FlowControl'',''*InterruptModeration'',''*RSS'',''EnablePME'',''*SelectiveSuspend'')){ if(Get-ItemProperty -Path $p -Name $n -EA 0){ Set-ItemProperty -Path $p -Name $n -Value ''0'' -Force -EA 0 } }; foreach($n in @(''*TCPChecksumOffloadIPv4'',''*TCPChecksumOffloadIPv6'',''*UDPChecksumOffloadIPv4'',''*UDPChecksumOffloadIPv6'',''*IPChecksumOffloadIPv4'')){ if(Get-ItemProperty -Path $p -Name $n -EA 0){ Set-ItemProperty -Path $p -Name $n -Value ''3'' -Force -EA 0 } }; foreach($n in @(''*LsoV2IPv4'',''*LsoV2IPv6'',''*RscIPv4'',''*RscIPv6'')){ if(Get-ItemProperty -Path $p -Name $n -EA 0){ Set-ItemProperty -Path $p -Name $n -Value ''1'' -Force -EA 0 } } }', runas: currentUserElevated, wait: true}
  # Trim non-essential bindings (IPv6 / ms_tcpip6 kept)
  - !powerShell: {command: 'Disable-NetAdapterBinding -Name ''*'' -ComponentID ms_lldp,ms_lltdio,ms_implat,ms_rspndr -ErrorAction SilentlyContinue', runas: currentUserElevated, wait: true}
  # Global TCP/UDP tuning
  - !cmd: {command: 'netsh int tcp set global timestamps=disabled >nul 2>&1', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'netsh int udp set global uro=enabled >nul 2>&1', runas: currentUserElevated, wait: true}
  - !powerShell: {command: 'Set-NetOffloadGlobalSetting -ReceiveSegmentCoalescing Enable -ErrorAction SilentlyContinue', runas: currentUserElevated, wait: true}

  # ==========================================================================
  # SECTION 30 - POWER PLAN  (WinSux - Ultimate Performance, high-perf tuned)
  # ==========================================================================
  - !status: {status: 'Configuring Power Plan'}
  # Duplicate Ultimate Performance to a fixed GUID and activate it
  - !cmd: {command: 'powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 99999999-9999-9999-9999-999999999999 >nul 2>&1', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'powercfg /SETACTIVE 99999999-9999-9999-9999-999999999999 >nul 2>&1', runas: currentUserElevated, wait: true}
  # Delete all other power plans
  - !powerShell: {command: "powercfg /L | ForEach-Object { if ($_ -match ':') { $g=($_ -split ':')[1].Trim(); $g=$g.Substring(0,$g.IndexOf('(')); if ($g -ne '99999999-9999-9999-9999-999999999999') { powercfg /delete $g 2>$null | Out-Null } } }", runas: currentUserElevated, wait: true}
  # Disable hibernate / fast startup / power throttling
  - !cmd: {command: 'powercfg /hibernate off', runas: currentUserElevated, wait: true}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power', value: 'HiberbootEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling', value: 'PowerThrottlingOff', type: REG_DWORD, data: '1'}
  # Processor min/max 100%, cooling active, USB selective suspend off, PCIe LSPM off
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 54533251-82be-4824-96c1-47b60b740d00 893dee8e-2bef-41e0-89c6-b55d0929964c 100 >nul 2>&1', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 54533251-82be-4824-96c1-47b60b740d00 bc5038f7-23e0-4960-96da-33abaf5935ec 100 >nul 2>&1', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 54533251-82be-4824-96c1-47b60b740d00 94d3a615-a899-4ac5-ae2b-e4d8f634367f 1 >nul 2>&1', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0 >nul 2>&1', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 501a4d13-42af-4429-9fd1-a8218c268e20 ee12f906-d277-404b-b6da-e5fa1a576df5 0 >nul 2>&1', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'powercfg /SETACTIVE 99999999-9999-9999-9999-999999999999 >nul 2>&1', runas: currentUserElevated, wait: true}

  # ==========================================================================
  # SECTION 31 - TIMER RESOLUTION  (WinSux "STR" service)
  #   Requires settimerresolutionservice.cs in Executables\ (copied to system by
  #   Section 01 robocopy, or referenced via exeDir). Compiled with in-box csc.
  # ==========================================================================
  - !status: {status: 'Installing Timer Resolution Service'}
  - !cmd: {exeDir: true, command: '"%SystemRoot%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:"%SystemRoot%\SetTimerResolutionService.exe" /r:System.ServiceProcess.dll /r:System.Configuration.Install.dll /r:System.Management.dll "settimerresolutionservice.cs" >nul 2>&1', runas: currentUserElevated, wait: true}
  - !powerShell: {command: 'if (Get-Service -Name ''STR'' -EA 0) { sc.exe delete ''STR'' | Out-Null; Start-Sleep 2 }; New-Service -Name ''STR'' -DisplayName ''Set Timer Resolution Service'' -BinaryPathName ($env:SystemRoot + ''\SetTimerResolutionService.exe'') -StartupType Automatic -EA 0 | Out-Null; Start-Service -Name ''STR'' -EA 0', runas: currentUserElevated, wait: true}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel', value: 'GlobalTimerResolutionRequests', type: REG_DWORD, data: '1'}

  # ==========================================================================
  # SECTION 32 - WINDOWS UPDATE - PAUSE  (toggle: disable-wu, WinSux 365-day)
  #   Pauses updates ~365 days (reversible), does NOT permanently disable WU.
  # ==========================================================================
  - !status: {status: 'Pausing Windows Update', option: 'disable-wu'}
  - !powerShell: {command: '$s=(Get-Date).ToUniversalTime().ToString(''yyyy-MM-ddTHH:mm:ssZ''); $e=(Get-Date).AddDays(365).ToUniversalTime().ToString(''yyyy-MM-ddTHH:mm:ssZ''); $k=''HKLM:\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings''; New-Item $k -Force -EA 0 | Out-Null; Set-ItemProperty $k PauseUpdatesExpiryTime $e -Force; Set-ItemProperty $k PauseFeatureUpdatesStartTime $s -Force; Set-ItemProperty $k PauseFeatureUpdatesEndTime $e -Force; Set-ItemProperty $k PauseQualityUpdatesStartTime $s -Force; Set-ItemProperty $k PauseQualityUpdatesEndTime $e -Force', runas: currentUserElevated, wait: true, option: 'disable-wu'}

  # ==========================================================================
  # SECTION 33 - EXTRA POWER SAVINGS  (toggle: disable-powersave, WinSux way)
  #   Aggressive powercfg tweaks NOT already in Section 30. Applied to the
  #   fixed Ultimate plan GUID from Section 30. Reversible (switch plan back).
  #   NOTE: uniform desktop/laptop (no chassis check) - can over-tune laptops.
  # ==========================================================================
  - !status: {status: 'Applying extra power savings', option: 'disable-powersave'}
  # Hard disk: never turn off
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 0012ee47-9041-4b5d-9b77-535fba8b1442 6738e2c4-e8a5-4a42-b16a-e040e769756e 0 >nul 2>&1', runas: currentUserElevated, wait: true, option: 'disable-powersave'}
  # Wireless adapter: maximum performance
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 19cbb8fa-5279-450e-9fac-8a3d5fedd0c1 12bbebe6-58d6-4636-95bb-3217ef867c1a 0 >nul 2>&1', runas: currentUserElevated, wait: true, option: 'disable-powersave'}
  # Wake timers: disabled
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 238c9fa8-0aad-41ed-83f4-97be242c8f20 bd3b718a-0680-4d9d-8ab2-e1d2b4ac806d 0 >nul 2>&1', runas: currentUserElevated, wait: true, option: 'disable-powersave'}
  # USB hub selective-suspend timeout 0 (unhide attribute + set)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerSettings\2a737441-1930-4402-8d77-b2bebba308a3\0853a681-27c8-4100-a2fd-82013e970683', value: 'Attributes', type: REG_DWORD, data: '0', option: 'disable-powersave'}
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 2a737441-1930-4402-8d77-b2bebba308a3 0853a681-27c8-4100-a2fd-82013e970683 0 >nul 2>&1', runas: currentUserElevated, wait: true, option: 'disable-powersave'}
  # USB3 link power management off (unhide attribute + set)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerSettings\2a737441-1930-4402-8d77-b2bebba308a3\d4e98f31-5ffe-4ce1-be31-1b38b384c009', value: 'Attributes', type: REG_DWORD, data: '0', option: 'disable-powersave'}
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 2a737441-1930-4402-8d77-b2bebba308a3 d4e98f31-5ffe-4ce1-be31-1b38b384c009 0 >nul 2>&1', runas: currentUserElevated, wait: true, option: 'disable-powersave'}
  # Unpark CPU cores (unhide core-parking min cores + set 100%)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerSettings\54533251-82be-4824-96c1-47b60b740d00\0cc5b647-c1df-4637-891a-dec35c318583', value: 'Attributes', type: REG_DWORD, data: '0', option: 'disable-powersave'}
  - !cmd: {command: 'powercfg /setacvalueindex 99999999-9999-9999-9999-999999999999 54533251-82be-4824-96c1-47b60b740d00 0cc5b647-c1df-4637-891a-dec35c318583 100 >nul 2>&1', runas: currentUserElevated, wait: true, option: 'disable-powersave'}
  # Re-apply plan so changes take effect
  - !cmd: {command: 'powercfg /SETACTIVE 99999999-9999-9999-9999-999999999999 >nul 2>&1', runas: currentUserElevated, wait: true, option: 'disable-powersave'}

  # ==========================================================================
  # SECTION 34 - POST-INSTALL TOOLKIT  (FR33THY Ultimate)
  #   Deployed to C:\AkariOS\Ultimate by Section 01 robocopy. Unblock the
  #   scripts (Mark-of-the-Web) and drop a desktop shortcut for manual use.
  # ==========================================================================
  - !status: {status: 'Installing Post-Install Toolkit'}
  - !powerShell: {command: 'Get-ChildItem -Path ($env:SystemDrive + ''\AkariOS\Ultimate'') -Recurse -ErrorAction SilentlyContinue | Unblock-File -ErrorAction SilentlyContinue', runas: currentUserElevated, wait: true}
  - !powerShell: {command: '$w=New-Object -ComObject WScript.Shell; $l=$w.CreateShortcut($env:PUBLIC + ''\Desktop\AkariOS Toolkit.lnk''); $l.TargetPath=($env:SystemDrive + ''\AkariOS\Ultimate''); $l.IconLocation=($env:SystemRoot + ''\System32\imageres.dll,109''); $l.Save()', runas: currentUserElevated, wait: true}

  # ==========================================================================
  # SECTION 35 - FILE ASSOCIATIONS
  #   Uses bundled SetFileTypeAssociation.ps1 (SFTA) from Executables\.
  # ==========================================================================
  - !status: {status: 'Setting file associations'}
  - !powerShell: {command: '.\SetFileTypeAssociation.ps1', exeDir: true, wait: true, runas: currentuser}

  # ==========================================================================
  # SECTION 36 - WALLPAPER / LOCKSCREEN / PROFILE PICTURE
  #   Images deployed to C:\Windows\Web\AkariOS\ by Section 01 robocopy.
  # ==========================================================================
  - !status: {status: 'Changing Wallpaper & Lockscreen'}
  - !powerShell: {command: '$path=''C:\Windows\Web\AkariOS\img0.png''; Get-ChildItem ''Registry::HKU'' | ForEach-Object {$key=$_.Name; [microsoft.win32.registry]::SetValue($key+''\Control Panel\Desktop'',''WallPaper'',$path,[Microsoft.Win32.RegistryValueKind]::String)}; Add-Type -TypeDefinition ''using System.Runtime.InteropServices; public class Wallpaper{[DllImport(\"user32.dll\",CharSet=CharSet.Auto)]public static extern int SystemParametersInfo(int uAction,int uParam,string lpvParam,int fuWinIni);}''; [Wallpaper]::SystemParametersInfo(20,0,$path,3)', runas: currentUserElevated, wait: true}
  - !powerShell: {command: 'Add-Type -AssemblyName System.Runtime.WindowsRuntime; [Windows.Storage.StorageFile,Windows.Storage,ContentType=WindowsRuntime] | Out-Null; [Windows.System.UserProfile.LockScreen,Windows.System.UserProfile,ContentType=WindowsRuntime] | Out-Null; $a=[System.WindowsRuntimeSystemExtensions].GetMethods(); $f=($a|Where-Object{$_.Name -eq ''AsTask'' -and $_.GetParameters()[0].ParameterType.Name -eq ''IAsyncOperation`1''})[0].MakeGenericMethod([Windows.Storage.StorageFile]).Invoke($null,@([Windows.Storage.StorageFile]::GetFileFromPathAsync(''C:\Windows\Web\AkariOS\img0.png''))).GetAwaiter().GetResult(); ($a|Where-Object{$_.Name -eq ''AsTask'' -and $_.GetParameters()[0].ParameterType.Name -eq ''IAsyncAction''})[0].Invoke($null,@([Windows.System.UserProfile.LockScreen]::SetImageFileAsync($f))).GetAwaiter().GetResult()', runas: currentUserElevated, wait: true}
  # Profile picture from bundled profile.png
  - !powerShell: {command: 'Add-Type -AssemblyName System.Drawing; $img=[System.Drawing.Image]::FromFile((Join-Path $PWD ''profile.png'')); $u=(Get-CimInstance Win32_ComputerSystem).UserName; $sid=(New-Object System.Security.Principal.NTAccount($u)).Translate([System.Security.Principal.SecurityIdentifier]).Value; $dest=''C:\Users\Public\AccountPictures\''+$sid; if(!(Test-Path $dest)){New-Item -Path $dest -ItemType Directory -Force|Out-Null}; $reg=''HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AccountPicture\Users\''+$sid; if(!(Test-Path $reg)){New-Item -Path $reg -Force|Out-Null}; @(1080,448,240,192,96,64,48,40,32)|ForEach-Object{$b=New-Object System.Drawing.Bitmap($_,$_);$g=[System.Drawing.Graphics]::FromImage($b);$g.DrawImage($img,0,0,$_,$_);$f=$dest+''\Image''+$_+''.png'';$b.Save($f);$g.Dispose();$b.Dispose();Set-ItemProperty -Path $reg -Name (''Image''+$_) -Value $f -Type String}; $img.Dispose()', exeDir: true, runas: currentUserElevated, wait: true}
  - !taskKill: {name: 'explorer'}

  # ==========================================================================
  # SECTION 37 - SYSTEM RESTORE  (SAFETY NET - decision #4, WinSux logic)
  #   Enable System Restore and create a fresh "AkariOS" restore point.
  #   This is why Sections 17/28 avoid VSS and Section 39 avoids delete-shadows.
  # ==========================================================================
  - !status: {status: 'Creating Restore Point'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore', value: 'SystemRestorePointCreationFrequency', type: REG_DWORD, data: '0'}
  - !powerShell: {command: 'Enable-ComputerRestore -Drive ''C:\'' -ErrorAction SilentlyContinue; Checkpoint-Computer -Description ''AkariOS'' -RestorePointType ''MODIFY_SETTINGS'' -ErrorAction SilentlyContinue', runas: currentUserElevated, wait: true}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\SystemRestore', value: 'SystemRestorePointCreationFrequency', operation: 'delete'}

  # ==========================================================================
  # SECTION 38 - REBUILD PERF COUNTERS
  # ==========================================================================
  - !status: {status: 'Rebuilding Perf Counters'}
  - !run: {exe: 'lodctr', args: '/r'}
  - !run: {exe: 'lodctr', args: '/r'}
  - !run: {exe: 'winmgmt', args: '/resyncperf'}

  # ==========================================================================
  # SECTION 39 - CLEANUP
  #   NOTE: 'vssadmin delete shadows' is deliberately OMITTED so the restore
  #   point created in Section 37 survives (safety net, decision #4).
  # ==========================================================================
  - !status: {status: 'Cleaning up'}
  - !file: {path: '%SystemDrive%\PerfLogs'}
  - !file: {path: '%SystemDrive%\inetpub'}
  - !cmd: {command: 'del /f /s /q "%WINDIR%\Temp\*" >nul 2>&1', wait: true}
  - !cmd: {command: 'for /f "tokens=*" %i in (''wevtutil el'') do wevtutil cl "%i" >nul 2>&1', wait: true}

  # ==========================================================================
  # SECTION 40 - END
  # ==========================================================================
  # Desktop icon cleanup: wipe stored icon positions so Windows resets to a clean layout on first login
  - !registryKey: {path: 'HKCU\Software\Microsoft\Windows\Shell\Bags\1\Desktop', operation: delete}
  - !status: {status: 'AkariOS V6 - Done'}