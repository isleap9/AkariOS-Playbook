  # ==========================================================================
  # SECTION 25 - GENERAL TWEAKS  (always on)
  # ==========================================================================
  - !status: {status: 'Applying general tweaks'}
  # Svchost split threshold (Vain universal 0xFFFFFFFF -> always group services,
  # lower RAM/process overhead; replaces V5 svchost.ps1)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control', value: 'SvcHostSplitThresholdInKB', type: REG_DWORD, data: '4294967295'}
  # Disable BitLocker on encrypted volumes (Ultimate logic, no menu/pause).
  # Only touches volumes still protected/encrypting; BDESVC is disabled in Section 17.
  - !powerShell: {command: 'try { Get-BitLockerVolume | Where-Object { $_.ProtectionStatus -eq ''On'' -or $_.VolumeStatus -ne ''FullyDecrypted'' } | ForEach-Object { Disable-BitLocker -MountPoint $_.MountPoint -ErrorAction SilentlyContinue | Out-Null } } catch { }', runas: currentUserElevated, wait: true}
  # Fault Tolerant Heap
  - !powerShell: {command: 'Set-ItemProperty -Path ''HKLM:\SOFTWARE\Microsoft\FTH'' -Name ''Enabled'' -Value 0 -Type DWORD -ErrorAction SilentlyContinue', wait: true}
