  # ==========================================================================
  # SECTION 17 - SERVICES  (general + telemetry)
  #   SAFETY-NET AUDIT: VSS, swprv, volsnap, sdrsvc, wbengine and the
  #   SystemRestore service are intentionally NOT disabled here, so that
  #   System Restore keeps working (see Section 37). Only vmicvss (Hyper-V
  #   guest VSS) is touched, and only in the Hyper-V section.
  #   Printing services -> Section 18 ; power-saving services -> Section 33.
  # ==========================================================================
  - !status: {status: 'Configuring Services'}
  # General
  - !service: {name: 'BDESVC', operation: change, startup: 4}            # BitLocker
  - !service: {name: 'CldFlt', operation: change, startup: 4}            # Cloud Files Filter
  - !service: {name: 'UCPD', operation: change, startup: 4}              # User Choice Protection Driver
  - !service: {name: 'onesyncsvc', operation: change, startup: 4}        # Sync Host
  - !service: {name: 'ShellHWDetection', operation: change, startup: 4}
  - !service: {name: 'sysmain', operation: change, startup: 4}
  - !service: {name: 'themes', operation: change, startup: 4}
  - !service: {name: 'Beep', operation: change, startup: 4}
  - !service: {name: 'CloudIdSvc', operation: change, startup: 4}
  - !service: {name: 'WPCMonSvc', operation: change, startup: 4}         # Parental Controls
  - !service: {name: 'MapsBroker', operation: change, startup: 4}
  - !service: {name: 'CloudBackupRestoreSvc', operation: change, startup: 4}
  - !service: {name: 'fhsvc', operation: change, startup: 4}             # File History (NOT System Restore)
  - !service: {name: 'semgrsvc', operation: change, startup: 4}          # Payments / NFC
  - !service: {name: 'wisvc', operation: change, startup: 4}             # Windows Insider
  # Telemetry / Reporting
