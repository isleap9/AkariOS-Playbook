<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>AkariOS</Name>
    <Username>Akari</Username>
    <Title>AkariOS V6</Title>
    <ShortDescription>A performance-focused Windows 11 debloat and hardening playbook.</ShortDescription>
    <Description>AkariOS strips Windows 11 down to its essentials — removing telemetry, disabling unnecessary services, hardening privacy, and tuning the system for peak gaming and daily-use performance. Every change is deliberate, documented, and reversible where it matters.</Description>
    <Version>6.0.0</Version>
    <SupportedBuilds>
        <string>19044</string>
        <string>19045</string>
        <string>22621</string>
        <string>22631</string>
        <string>26100</string>
        <string>26200</string>
    </SupportedBuilds>
    <Requirements>
        <Requirement>DefenderToggled</Requirement>
        <Requirement>NoAntivirus</Requirement>
        <Requirement>Internet</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <UseKernelDriver>false</UseKernelDriver>
	<Overhaul>true</Overhaul>
	<Git>https://github.com/isleap9/AkariOS-Playbook</Git>
	<ISO>
		<DisableBitLocker>true</DisableBitLocker>
		<DisableHardwareRequirements>true</DisableHardwareRequirements>
	</ISO>
	<SupportsISO>true</SupportsISO>
	<OOBE>
	  <BulletPoints>
		<BulletPoint Icon="Lock" Title="Reliable"
		Description="Through thorough testing, we've done our best to ensure that this is a reliable deployment process."/>
		<BulletPoint Icon="Privacy" Title="Enhanced privacy"
		Description="The process will enhance your privacy using various methods, such as removing privacy infringing services."/>
		<BulletPoint Icon="Rocket" Title="Optimized"
		Description="New default apps, performance optimizations, and refined UI changes will all be implemented."/>
	  </BulletPoints>
	</OOBE>
	<FeaturePages>
		<CheckboxPage IsRequired="false" Description="Install a browser?">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Install a Browser</Text>
                    <Name>install-browser</Name>
				</CheckboxOption>
            </Options>
		</CheckboxPage>
		<RadioImagePage DependsOn="install-browser" DefaultOption="browser-brave">
			<TopLine Text="Select a browser (Page 1/2)"/>
			<Options>
				<RadioImageOption>
					<Text>Mercury</Text>
					<Name>browser-mercury</Name>
					<FileName>mercury</FileName>
					<GradientTopColor>#1ae3dc</GradientTopColor>
					<GradientBottomColor>#5743ff</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Thorium</Text>
					<Name>browser-thorium</Name>
					<FileName>thorium</FileName>
					<GradientTopColor>#4A90D9</GradientTopColor>
					<GradientBottomColor>#1A1A2E</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Brave</Text>
					<Name>browser-brave</Name>
					<FileName>brave</FileName>
					<GradientTopColor>#FFFFFE</GradientTopColor>
					<GradientBottomColor>#880808</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Next Page →</Text>
					<Name>browser-page1-next</Name>
					<FileName>next</FileName>
					<GradientTopColor>#4A4A4A</GradientTopColor>
					<GradientBottomColor>#2C2C2C</GradientBottomColor>
				</RadioImageOption>
			</Options>
			<BottomLine Text="Mercury/Thorium require AVX2"/>
		</RadioImagePage>
		<RadioImagePage DependsOn="browser-page1-next" DefaultOption="browser-librewolf">
			<TopLine Text="Select a browser (Page 2/2)"/>
			<Options>
				<RadioImageOption>
					<Text>LibreWolf</Text>
					<Name>browser-librewolf</Name>
					<FileName>librewolf</FileName>
					<GradientTopColor>#00ACFF</GradientTopColor>
					<GradientBottomColor>#3A1F5D</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Firefox</Text>
					<Name>browser-firefox</Name>
					<FileName>firefox</FileName>
					<GradientTopColor>#FF3647</GradientTopColor>
					<GradientBottomColor>#FFC742</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Chrome</Text>
					<Name>browser-chrome</Name>
					<FileName>chrome</FileName>
					<GradientTopColor>#4285F4</GradientTopColor>
					<GradientBottomColor>#34A853</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Keep Edge</Text>
					<Name>browser-edge</Name>
					<FileName>edge</FileName>
					<GradientTopColor>#47d18c</GradientTopColor>
					<GradientBottomColor>#0f529a</GradientBottomColor>
				</RadioImageOption>
			</Options>
			<BottomLine Text="Pick Edge to KEEP it - any other choice removes Edge"/>
		</RadioImagePage>
        <CheckboxPage IsRequired="true" Description="Security configuration">
            <Options>
			    <CheckboxOption IsChecked="false">
                    <Text>Disable Windows Defender</Text>
                    <Name>disable-defender</Name>
				</CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable User Account Control</Text>
                    <Name>disable-uac</Name>
				</CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Process Mitigations</Text>
                    <Name>disable-process-mitigations</Name>
				</CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Spectre And Meltdown</Text>
                    <Name>disable-spectre-meltdown</Name>
				</CheckboxOption>
            </Options>
		</CheckboxPage>
        <CheckboxPage IsRequired="true" Description="Please configure these Windows settings to your liking. (1/2)">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Dark Mode</Text>
                    <Name>enable-dark-mode</Name>
				</CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Legacy Context Menu For Windows 11</Text>
                    <Name>legacy-context-menu</Name>
				</CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Legacy Photo Viewer</Text>
                    <Name>remove-uwp-photos</Name>
				</CheckboxOption>
            </Options>
		</CheckboxPage>
        <CheckboxPage IsRequired="true" Description="Please configure these Windows settings to your liking. (2/2)">
           <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Printer</Text>
                    <Name>disable-print</Name>
				</CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Bluetooth</Text>
                    <Name>disable-bluetooth</Name>
				</CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Windows Update</Text>
                    <Name>disable-wu</Name>
				</CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Extra Power Savings</Text>
                    <Name>disable-powersave</Name>
				</CheckboxOption>
           </Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Tick what you would like to disable.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Remove OneDrive</Text>
                    <Name>remove-onedrive</Name>
				</CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Hyper-V and VBS</Text>
                    <Name>disable-hyperv</Name>
                    <Description>⚠️ Some anti-cheats (Valorant, FACEIT, etc.) require Hyper-V/VBS. Only disable if you don't play games that enforce them.</Description>
                </CheckboxOption>
		        <CheckboxOption IsChecked="false">
                    <Text>Disable Memory Compression</Text>
                    <Name>disable-memory-compression</Name>
                </CheckboxOption>
            </Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="false" Description="Extras">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>7-Zip</Text>
                    <Name>7zip</Name>
				</CheckboxOption>
            </Options>
		</CheckboxPage>
		</FeaturePages>
</Playbook>
